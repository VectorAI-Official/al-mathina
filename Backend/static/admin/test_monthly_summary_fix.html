<!DOCTYPE html>
<html>
<head>
    <title>Test Monthly Summary Fix</title>
</head>
<body>
    <h1>Testing Monthly Summary Data Parsing</h1>
    <div id="results"></div>
    
    <script>
        async function testMonthlySummary() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Testing...</p>';
            
            try {
                // Test fetching data for Dec 22, 2025
                const testDate = '2025-12-22';
                const response = await fetch(`/admin/api/stores/statistics?start_date=${testDate}&end_date=${testDate}`);
                
                if (response.ok) {
                    const data = await response.json();
                    
                    // OLD WAY (BUG - accessing wrong path)
                    const oldOrders = data.total_orders || 0;
                    const oldRevenue = data.total_revenue || 0;
                    
                    // NEW WAY (FIX - accessing correct path)
                    const stats = data.statistics || {};
                    const newOrders = stats.total_orders || 0;
                    const newRevenue = stats.total_revenue || 0;
                    
                    resultsDiv.innerHTML = `
                        <h2>API Response Structure:</h2>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                        
                        <h2>Data Extraction Comparison (${testDate}):</h2>
                        <table border="1" cellpadding="10">
                            <tr>
                                <th>Method</th>
                                <th>Orders</th>
                                <th>Revenue</th>
                                <th>Status</th>
                            </tr>
                            <tr>
                                <td><strong>OLD (BUG)</strong><br><code>data.total_orders</code></td>
                                <td>${oldOrders}</td>
                                <td>₹${oldRevenue}</td>
                                <td style="background: #ffcccc;">❌ WRONG - Always returns 0</td>
                            </tr>
                            <tr>
                                <td><strong>NEW (FIX)</strong><br><code>data.statistics.total_orders</code></td>
                                <td>${newOrders}</td>
                                <td>₹${newRevenue.toFixed(2)}</td>
                                <td style="background: #ccffcc;">✅ CORRECT - Returns actual data</td>
                            </tr>
                        </table>
                        
                        <h2>Explanation:</h2>
                        <p>The API returns data nested under <code>statistics</code> object, but the frontend was accessing it directly at the root level. This caused all values to be undefined/0.</p>
                        
                        <p><strong>Fix Applied:</strong> Changed <code>data.total_orders</code> to <code>data.statistics.total_orders</code></p>
                    `;
                } else {
                    resultsDiv.innerHTML = `<p style="color: red;">❌ API Error: ${response.status}</p>`;
                }
            } catch (error) {
                resultsDiv.innerHTML = `<p style="color: red;">❌ Error: ${error.message}</p>`;
            }
        }
        
        // Run test on page load
        testMonthlySummary();
    </script>
</body>
</html>
