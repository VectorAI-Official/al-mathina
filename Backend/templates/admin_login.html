<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - AL-Madhina</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #004D40 0%, #00695C 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-section h1 {
            color: #004D40;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .logo-section p {
            color: #666;
            font-size: 14px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            padding: 12px 15px;
            border: 2px solid #E0E0E0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #004D40;
        }

        .login-button {
            background: linear-gradient(135deg, #004D40 0%, #00695C 100%);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 77, 64, 0.3);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .error-message {
            background: #FFEBEE;
            color: #C62828;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .info-box {
            background: #E8F5E9;
            border-left: 4px solid #4CAF50;
            padding: 12px;
            border-radius: 4px;
            margin-top: 20px;
            font-size: 13px;
            color: #2E7D32;
        }

        .info-box strong {
            display: block;
            margin-bottom: 5px;
        }

        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .login-container {
                padding: 30px 20px;
                max-width: 100%;
            }

            .logo-section h1 {
                font-size: 28px;
            }

            .logo-section p {
                font-size: 13px;
            }

            .form-group input {
                padding: 12px;
                font-size: 16px; /* Prevents zoom on iOS */
            }

            .login-button {
                padding: 14px;
                font-size: 16px;
            }

            .info-box {
                font-size: 12px;
                padding: 10px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .login-container {
                padding: 25px 15px;
                border-radius: 12px;
            }

            .logo-section {
                margin-bottom: 25px;
            }

            .logo-section h1 {
                font-size: 24px;
            }

            .login-form {
                gap: 15px;
            }

            .form-group {
                gap: 6px;
            }

            .form-group label {
                font-size: 13px;
            }

            .error-message {
                padding: 10px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <h1>🔐 AL-Madhina</h1>
            <p>Admin Dashboard Login</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form class="login-form" method="POST" action="/admin/login" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="Enter admin username"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter admin password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="login-button">
                Login to Dashboard
            </button>
        </form>

        <div class="info-box">
            <strong>Development Credentials:</strong>
            Username: <code>admin</code><br>
            Password: <code>admin123</code>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.classList.remove('show');
            return true;
        }

        // Check for URL parameters indicating error
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error') === '1') {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = 'Invalid username or password. Please try again.';
            errorDiv.classList.add('show');
        }
    </script>
</body>
</html>
