# Fly.io deployment configuration
app = "almathina-backend"
primary_region = "sin"  # Singapore region (change based on your location)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "9000"
  HOST = "0.0.0.0"
  MONGO_DB_NAME = "almadhinadb"

[http_service]
  internal_port = 9000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "10s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
