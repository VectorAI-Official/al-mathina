# Fly.io configuration for AL-Madhina Backend
app = "almathina-backend"
primary_region = "sin"  # Singapore

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[env]
  ENVIRONMENT = "production"
  PORT = "8080"

