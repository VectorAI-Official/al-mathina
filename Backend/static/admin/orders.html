<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Order Management - AL-Madhina Admin</title>
    <link rel="stylesheet" href="css/orders.css?v=2.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="orders-page">
        <!-- Header -->
        <div class="orders-header" style="background: linear-gradient(135deg, #1B5E20 0%, #2E7D32 100%) !important; padding: 35px 40px 40px 40px !important; border-radius: 0 !important; box-shadow: 0 4px 20px rgba(27, 94, 32, 0.25) !important;">
            <div class="header-content">
                <h1 style="color: white !important;"><i class="fas fa-shopping-cart"></i> Order Management</h1>
                <button class="btn btn-primary back-to-dashboard-btn" onclick="window.location.href='/admin/dashboard'" style="background: white !important; color: #1B5E20 !important; padding: 14px 28px !important;">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </button>
            </div>
        </div>

        <!-- Order Statistics -->
        <div class="order-stats">
            <div class="stat-card">
                <div class="stat-icon blue">
                    <i class="fas fa-shopping-bag"></i>
                </div>
                <div class="stat-content">
                    <h3>Total Orders</h3>
                    <p id="totalOrders">-</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="stat-content">
                    <h3>Pending</h3>
                    <p id="pendingOrders">-</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="stat-content">
                    <h3>Delivered</h3>
                    <p id="deliveredOrders">-</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple">
                    <i class="fas fa-rupee-sign"></i>
                </div>
                <div class="stat-content">
                    <h3>Total Revenue</h3>
                    <p id="totalRevenue">-</p>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="orders-filters">
            <div class="filter-group">
                <label for="searchInput">
                    <i class="fas fa-search"></i> Search
                </label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search by Order ID, Customer, Phone, Store..."
                        oninput="filterOrders()"
                        onkeyup="filterOrders()"
                        style="flex: 1;"
                    >
                    <button 
                        id="clearSearchBtn" 
                        onclick="clearSearch()" 
                        style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; color: #666; display: none;"
                        title="Clear search"
                    >
                        <i class="fas fa-times-circle"></i>
                    </button>
                </div>
            </div>
            <div class="filter-group">
                <label for="statusFilter">
                    <i class="fas fa-filter"></i> Filter by Status
                </label>
                <select id="statusFilter" onchange="filterOrders()">
                    <option value="">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="delivered">Delivered</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="dateFilter">
                    <i class="fas fa-calendar-alt"></i> Filter by Date
                </label>
                <select id="dateFilter" onchange="handleDateFilterChange()">
                    <option value="all">All Days</option>
                    <option value="single">Select Date</option>
                    <option value="range">Date Range</option>
                </select>
            </div>
            <div class="filter-group" id="dateDisplayGroup" style="display: none;">
                <label>
                    <i class="fas fa-calendar-check"></i> Selected Date(s)
                </label>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span id="dateDisplay" style="padding: 8px 12px; background: #f5f5f5; border-radius: 4px; font-size: 14px;"></span>
                    <button onclick="clearDateFilter()" class="btn btn-secondary" style="padding: 6px 12px; font-size: 13px;">
                        <i class="fas fa-times"></i> Clear
                    </button>
                </div>
            </div>
        </div>

        <!-- Orders Container -->
        <div id="ordersContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading orders...</p>
            </div>
        </div>
    </div>

    <!-- Order Details Modal -->
    <div id="orderDetailsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-file-invoice"></i> Order Details</h2>
                <span class="close-modal" onclick="closeOrderDetailsModal()">&times;</span>
            </div>
            <div id="orderDetailsContent">
                <!-- Order details will be loaded here (including modal-body and actions) -->
            </div>
        </div>
    </div>

    <!-- Single Date Picker Modal -->
    <div id="singleDateModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h2><i class="fas fa-calendar"></i> Select Date</h2>
                <span class="close-modal" onclick="closeDateModal()">&times;</span>
            </div>
            <div class="modal-body" style="padding: 20px;">
                <input type="date" id="singleDatePicker" class="date-picker-input" style="width: 100%; padding: 10px; font-size: 16px; border: 2px solid #4CAF50; border-radius: 4px;">
                <div style="margin-top: 20px; text-align: right;">
                    <button onclick="closeDateModal()" class="btn btn-secondary" style="margin-right: 10px;">Cancel</button>
                    <button onclick="applySingleDate()" class="btn btn-primary">Apply</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Date Range Picker Modal -->
    <div id="rangeDateModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h2><i class="fas fa-calendar-week"></i> Select Date Range</h2>
                <span class="close-modal" onclick="closeDateModal()">&times;</span>
            </div>
            <div class="modal-body" style="padding: 20px;">
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">From Date:</label>
                    <input type="date" id="startDatePicker" class="date-picker-input" style="width: 100%; padding: 10px; font-size: 16px; border: 2px solid #4CAF50; border-radius: 4px;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">To Date:</label>
                    <input type="date" id="endDatePicker" class="date-picker-input" style="width: 100%; padding: 10px; font-size: 16px; border: 2px solid #4CAF50; border-radius: 4px;">
                </div>
                <div style="text-align: right;">
                    <button onclick="closeDateModal()" class="btn btn-secondary" style="margin-right: 10px;">Cancel</button>
                    <button onclick="applyDateRange()" class="btn btn-primary">Apply</button>
                </div>
            </div>
        </div>
    </div>

    <!-- html2canvas library for PDF generation -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <!-- jsPDF library for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <script src="js/orders.js?v=2.0"></script>
</body>
</html>
