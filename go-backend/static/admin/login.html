<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - AL-Madhina</title>
    <link rel="stylesheet" href="/static/admin/css/login.css?v=1.0">
</head>

<body>
    <div class="login-container">
        <div class="logo-section">
            <h1>🔐 AL-Madhina</h1>
            <p>Admin Dashboard Login</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form class="login-form" method="POST" action="/admin/login" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter admin username" required
                    autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter admin password" required
                    autocomplete="current-password">
            </div>

            <input type="hidden" name="next" id="next">
            <button type="submit" class="login-button">
                Login to Dashboard
            </button>
        </form>

    </div>

    <script>
        function handleLogin(event) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.classList.remove('show');
            return true;
        }

        // Check for URL parameters indicating error
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error') === '1') {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = 'Invalid username or password. Please try again.';
            errorDiv.classList.add('show');
        }

        // Check for next parameter (for deep linking)
        const nextParam = urlParams.get('next');
        if (nextParam) {
            document.getElementById('next').value = nextParam;
        }
    </script>
</body>

</html>
